mode: deployment

replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    otlp:
      endpoint: tempo:4317
      tls:
        insecure: true
    prometheus:
      endpoint: "0.0.0.0:8889"
    debug:
      verbosity: basic

  connectors:
    # Derives RED metrics (request rate, errors, duration) from incoming spans.
    spanmetrics: {}

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions:
      - health_check

    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp
          - debug
          - spanmetrics
      metrics:
        receivers:
          - otlp
          - spanmetrics
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheus
          - debug

ports:
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

# Let Prometheus scrape the collector's Prometheus exporter (:8889),
# which now carries the spanmetrics-derived RED metrics.
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s
