# Telegram bot token for Alertmanager.
#
# DO NOT commit the real token. Either edit a copy of this file, or create the
# secret imperatively (recommended):
#
#   kubectl -n observability create secret generic telegram-bot-token \
#     --from-literal=token='123456789:AAExxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
#
# The key MUST be named `token` — Alertmanager reads it via
#   bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
# (the mount path is derived from the secret name in alertmanagerSpec.secrets).
apiVersion: v1
kind: Secret
metadata:
  name: telegram-bot-token
  namespace: observability
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_BOT_TOKEN"
